# hypridle: gestión de inactividad. Lo lanza autostart.lua.
#
# EL BLOQUEO LO SIRVE QUICKSHELL, no hyprlock. Antes aquí había
# `lock_cmd = pidof hyprlock || hyprlock`, y eso ahora choca: el shell escucha
# la señal Lock de logind y bloquea él, así que con `on-timeout = loginctl
# lock-session` acababan DOS bloqueadores peleándose por el mismo protocolo de
# Wayland (ext-session-lock), que solo admite uno. Apuntando lock_cmd al shell,
# todos los caminos —el temporizador, la suspensión y `loginctl lock-session` a
# mano— acaban en el mismo sitio. La llamada es idempotente: si ya está
# bloqueado, no hace nada.
#
# Para volver a hyprlock: Ajustes ▸ Shell ▸ Pantalla de bloqueo, y aquí
# `lock_cmd = pidof hyprlock || hyprlock`. La copia previa está en
# hypridle.conf.antes-quickshell-lock.

general {
    lock_cmd       = qs ipc call panel lock
    before_sleep_cmd = loginctl lock-session       # bloquea antes de suspender
    after_sleep_cmd  = hyprctl dispatch dpms on     # enciende pantalla al volver
    ignore_dbus_inhibit = false                     # respeta inhibidores (vídeo)
}

# 2,5 min sin actividad: baja el brillo (se restaura al volver).
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min: bloqueo.
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 6 min: apaga la pantalla (DPMS off).
listener {
    timeout    = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 30 min: suspende.
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
