[ColorScheme]
#https://doc.qt.io/archives/qt-5.15/qpalette.html
#https://doc.qt.io/qt-6/qpalette.html - Qt6 didn't add/delete/change any of the color functions or docs
# functions that correspond to the colors definition location
# windowText,button,light,midlight,dark,mid,text,brightText,buttonText,base,window,shadow,highlight,highlightedText,link,linkVisited,alternateBase,NO_IDEA (just use some sane default),toolTipBase,toolTipText,placeholderText,accent
#
# light/midlight/dark/mid son los tonos de RELIEVE (bordes, marcos, hundidos).
# Salen de la rampa de contenedores de la paleta, no de grises fijos: con
# grises claros cosidos a mano, un tema oscuro dibujaba marcos luminosos
# alrededor de cada control.
# 'base' (fondo de los campos de texto) va un escalón por debajo de 'window'
# para que un campo se distinga del panel que lo rodea, y 'button' un escalón
# por encima, para que un botón se distinga del fondo.
active_colors={{onBackground}}, {{surfaceContainerHigh}}, {{surfaceContainerHighest}}, {{surfaceContainerHigh}}, {{surfaceContainerLowest}}, {{surfaceContainerLow}}, {{onBackground}}, #ffffff, {{onSurface}}, {{surfaceContainerLowest}}, {{background}}, {{shadow}}, {{primaryContainer}}, {{onPrimaryContainer}}, {{secondary}}, {{primary}}, {{surfaceVariant}}, {{surface}}, {{surfaceVariant}}, {{onSurface}}, {{onSurfaceVariant}}, {{primary}}
# Deshabilitado: los FONDOS no cambian, pero todo lo que es texto baja a
# 'outline'. Antes esta línea era idéntica a la de arriba, así que en las apps
# Qt un botón apagado se leía igual que uno activo — no había forma de saber
# qué se podía pulsar.
disabled_colors={{outline}}, {{surfaceContainerHigh}}, {{surfaceContainerHighest}}, {{surfaceContainerHigh}}, {{surfaceContainerLowest}}, {{surfaceContainerLow}}, {{outline}}, {{outline}}, {{outline}}, {{surfaceContainerLowest}}, {{background}}, {{shadow}}, {{surfaceVariant}}, {{outline}}, {{outline}}, {{outline}}, {{surfaceVariant}}, {{surface}}, {{surfaceVariant}}, {{outline}}, {{outline}}, {{outline}}
# Ventana sin foco: igual que activa salvo la selección, que se apaga a un
# tono neutro — así se ve de un vistazo qué ventana tiene el teclado.
inactive_colors={{onBackground}}, {{surfaceContainerHigh}}, {{surfaceContainerHighest}}, {{surfaceContainerHigh}}, {{surfaceContainerLowest}}, {{surfaceContainerLow}}, {{onBackground}}, #ffffff, {{onSurface}}, {{surfaceContainerLowest}}, {{background}}, {{shadow}}, {{surfaceVariant}}, {{onSurfaceVariant}}, {{secondary}}, {{primary}}, {{surfaceVariant}}, {{surface}}, {{surfaceVariant}}, {{onSurface}}, {{onSurfaceVariant}}, {{primary}}
